name: Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - run: |
          sudo apt -y install python3-parse

          curl --output aapt2.jar https://dl.google.com/android/maven2/com/android/tools/build/aapt2/8.12.0-alpha05-12782657/aapt2-8.12.0-alpha05-12782657-linux.jar
          sudo unzip -d /usr/bin aapt2.jar aapt2
          rm aapt2.jar

      - uses: actions/checkout@v6

      - run: ./cicd/verify-permissions.py

      - run: make gapps_arm gapps_arm64

      - uses: actions/upload-artifact@v7
        with:
          path: out/*-arm-*.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: out/*-arm-*.zip.sha256sum
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: out/*-arm64-*.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: out/*-arm64-*.zip.sha256sum
          archive: false
